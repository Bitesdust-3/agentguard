# Public development configuration. Copy and adjust locally as needed.
server:
  host: 127.0.0.1
  port: 8080

storage:
  sqlite_path: data/agentguard.db

provider:
  type: mock

detection:
  pii:
    enabled: true
    threshold: 0.80
  secret:
    enabled: true
    threshold: 0.80
  prompt_injection:
    enabled: true
    threshold: 0.85

policy:
  input:
    default_action: PASS
    rules:
      - id: input.secret.block.v1
        when:
          detection_type: SECRET
          min_score: 0.98
        action: BLOCK
      - id: input.secret.redact.v1
        when:
          detection_type: SECRET
          min_score: 0.80
        action: REDACT
      - id: input.pii.redact.v1
        when:
          detection_type: PII
          min_score: 0.80
        action: REDACT
      - id: input.prompt_injection.block.v1
        when:
          detection_type: PROMPT_INJECTION
          min_score: 0.85
        action: BLOCK
  output:
    default_action: PASS
    rules:
      - id: output.secret.block.v1
        when:
          detection_type: SECRET
          min_score: 0.98
        action: BLOCK
      - id: output.secret.redact.v1
        when:
          detection_type: SECRET
          min_score: 0.80
        action: REDACT
      - id: output.pii.redact.v1
        when:
          detection_type: PII
          min_score: 0.80
        action: REDACT
