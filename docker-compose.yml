services:
  agentguard:
    image: agentguard:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${AGENTGUARD_PORT:-8080}:8080"
    environment:
      AGENTGUARD_PROVIDER_API_KEY: ${AGENTGUARD_PROVIDER_API_KEY:-}
    volumes:
      - agentguard-data:/app/data
      - ./configs/config.docker.yaml:/app/configs/config.docker.yaml:ro
    init: true
    restart: unless-stopped

volumes:
  agentguard-data:
