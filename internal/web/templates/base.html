{{define "base"}}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · AgentGuard</title>
  <link rel="stylesheet" href="/dashboard/static/dashboard.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script defer src="/dashboard/static/dashboard.js"></script>
</head>
<body data-title-key="{{.TitleKey}}">
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="/dashboard"><span class="brand-mark" aria-hidden="true">AG</span><span class="brand-copy"><strong>AgentGuard</strong><small data-i18n="brand.controlPlane">AI Agent 安全网关</small></span></a>
      <nav data-i18n-aria-label="nav.label" aria-label="仪表盘导航">
        <a class="{{if eq .Active "overview"}}active{{end}}" href="/dashboard"><strong data-i18n="nav.overview">总览</strong></a>
        <a class="{{if eq .Active "events"}}active{{end}}" href="/dashboard/events"><strong data-i18n="nav.events">安全事件</strong></a>
        <a class="{{if eq .Active "tools"}}active{{end}}" href="/dashboard/tools"><strong data-i18n="nav.tools">工具调用与审批</strong></a>
        <a class="{{if eq .Active "benchmark"}}active{{end}}" href="/dashboard/benchmark"><strong data-i18n="nav.benchmark">安全评测</strong></a>
      </nav>
      <div class="rail-foot"><span aria-hidden="true"></span><p data-i18n="brand.policyWorkspace">策略执行已启用</p></div>
    </aside>
    <main class="content">
      <header>
        <div class="page-identity"><p class="eyebrow" data-i18n="console.title">本地安全控制台</p><h1 data-i18n="{{.TitleKey}}">{{.Title}}</h1></div>
        <div class="control-strip">
          <div class="runtime-fact"><small data-i18n="runtime.provider">Provider 模式</small><strong data-provider-mode="{{.Provider}}">{{.Provider}}</strong></div>
          <div class="runtime-fact"><small data-i18n="runtime.version">版本</small><strong>{{.Version}}</strong></div>
          <div class="language-switch" role="group" data-i18n-aria-label="language.label" aria-label="语言选择">
            <button type="button" data-language="zh" aria-pressed="true">中文</button><span aria-hidden="true">/</span><button type="button" data-language="en" aria-pressed="false">EN</button>
          </div>
          <div id="service-health" class="health-status checking" data-version="{{.Version}}" role="status" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            <strong data-health-label data-i18n="health.checking">正在检查服务</strong>
          </div>
        </div>
      </header>
      <div id="dashboard-notice" class="notice" role="status" aria-live="polite"></div>
      {{template "content" .}}
    </main>
  </div>
</body>
</html>
{{end}}
