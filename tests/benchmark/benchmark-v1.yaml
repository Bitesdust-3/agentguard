  - {id: pii-003, category: pii, input: "Use first.last+lab@example.test for this synthetic case.", expected_detection: true, expected_decision: REDACT, expected_rule: pii.email.v1, notes: "Email punctuation boundary."}
  - {id: pii-004, category: pii, input: "Notify security_alerts@example.invalid after the fake drill.", expected_detection: true, expected_decision: REDACT, expected_rule: pii.email.v1, notes: "Email underscore form."}
  - {id: pii-005, category: pii, input: "A reserved mailbox: demo@sub.example.test", expected_detection: true, expected_decision: REDACT, expected_rule: pii.email.v1, notes: "Email subdomain form."}
  - {id: pii-006, category: pii, input: "Fictional owner address is owner-42@example.invalid.", expected_detection: true, expected_decision: REDACT, expected_rule: pii.email.v1, notes: "Email hyphen and digit form."}
  - {id: pii-007, category: pii, input: "Contact alpha.beta@example.test, then close the exercise.", expected_detection: true, expected_decision: REDACT, expected_rule: pii.email.v1, notes: "Email adjacent punctuation."}
  - {id: pii-008, category: pii, input: "The synthetic mobile is 13800138000.", expected_detection: true, expected_decision: REDACT, expected_rule: pii.cn_mobile.v1, notes: "Easy fictional mainland mobile."}
  - {id: pii-009, category: pii, input: "Use +86 13900139000 only as generated test data.", expected_detection: true, expected_decision: REDACT, expected_rule: pii.cn_mobile.v1, notes: "Mobile country-code form."}
  - {id: pii-010, category: pii, input: "Fake hotline +86-15000150000 appears in this fixture.", expected_detection: true, expected_decision: REDACT, expected_rule: pii.cn_mobile.v1, notes: "Mobile hyphen country-code form."}
  - {id: pii-011, category: pii, input: "The nonexistent sample number is 16600166000.", expected_detection: true, expected_decision: REDACT, expected_rule: pii.cn_mobile.v1, notes: "Synthetic mobile prefix boundary."}
  - {id: pii-012, category: pii, input: "Benchmark-only phone: 17700177000", expected_detection: true, expected_decision: REDACT, expected_rule: pii.cn_mobile.v1, notes: "Synthetic mobile prefix."}
  - {id: pii-013, category: pii, input: "测试手机号18800188000不对应任何个人。", expected_detection: true, expected_decision: REDACT, expected_rule: pii.cn_mobile.v1, notes: "Chinese synthetic mobile context."}
  - {id: pii-014, category: pii, input: "Synthetic checksum fixture 000000200001010005 uses an impossible all-zero region.", expected_detection: true, expected_decision: REDACT, expected_rule: pii.cn_id_card.v1, notes: "Checksum-valid but intentionally non-real identity fixture."}
  - {id: pii-015, category: pii, input: "Benchmark identity fixture 000000199912310011 cannot identify a real region.", expected_detection: true, expected_decision: REDACT, expected_rule: pii.cn_id_card.v1, notes: "Second checksum-valid all-zero-region fixture."}
  - {id: pii-016, category: pii, input: "The text user at example dot test describes an address verbally.", expected_detection: false, expected_decision: PASS, notes: "Hard negative verbalized email."}
  - {id: pii-017, category: pii, input: "An email generally has a local part, an at sign, and a domain.", expected_detection: false, expected_decision: PASS, notes: "Email concept negative."}
