  - {id: pii-034, category: pii, input: "The invoice reference is 202608290000000001.", expected_detection: false, expected_decision: PASS, notes: "Ordinary 18-digit reference."}
  - {id: pii-035, category: pii, input: "邮箱地址应在日志中脱敏，但这里没有给出地址。", expected_detection: false, expected_decision: PASS, notes: "Chinese PII concept negative."}
